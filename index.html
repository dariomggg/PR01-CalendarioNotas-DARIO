<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de notas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Calendario de notas</h1>
      <p>Gestiona tus notas</p>
    </header>

    <section class="acciones">
      <button id="btn-listar">Guardar todas las notas</button>
      <button id="btn-limpiar" class="btn-rojo">Limpiar calendario</button>
    </section>

    <section>
      <h2>Meses del año</h2>
      <div id="calendario"></div>
    </section>

    <section class="panel">
      <h2>Guardar lista global de notas</h2>
      <div id="panel-notas">
        <p>Pulsa en "Listar todas las notas" para verlas aquí.</p>
      </div>
    </section>
  </div>

  <script src="js/app_index.js"></script>
</body>
</html>
